[package]
name = "visual-learn"
version = "0.0.1"
description = "一个学习进度追踪应用"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "dialog-open", "shell-open", "fs-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 用于调用 NSApp activateIgnoringOtherApps，解决从 VSCode 全屏终端启动时窗口叠在原 Space 的问题
objc = "0.2"

[features]
# 默认情况下，此功能是启用的。在开发中禁用它以使用 DevTools。
default = ["custom-protocol"]
# 此功能仅在创建生产版本时使用
custom-protocol = ["tauri/custom-protocol"]
